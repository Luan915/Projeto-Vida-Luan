<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>

        <div class="conteudo">
            <div class="botoes">
                <button class="botao ativo">Me formar no Ensino Médio</button>
                <button class="botao">Fazer uma viagem para MG</button>
                <button class="botao">Ingressar na faculdade</button>
                <button class="botao">Me mudar para Curitiba</button>
            </div>

            <div class="abas-textos">
                <div class="aba-conteudo ativo">
                    <h3 class="aba-conteudo-titulo-principal">Me formar no Ensino Médio </h3>
                    <h4 class="aba-conteudo-titulo-secundario"> 2 meses</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Fazer uma viagem para MG </h3>
                    <h4 class="aba-conteudo-titulo-secundario"> 4 meses</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Ingressar na faculdade </h3>
                    <h4 class="aba-conteudo-titulo-secundario"> 5 meses</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Me mudar para Curitiba </h3>
                    <h4 class="aba-conteudo-titulo-secundario"> 4 meses</h4>
                    <div class="contador"></div>
                </div>
            </div>
        </div>

    </section>
    <script src="main.js"></script>
</body>

</html>
